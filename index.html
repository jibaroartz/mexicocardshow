<title>Mapa México Card Show</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: sticky demo bar, event header, three explore tabs (map, search, participants) and a seller panel. Powered by VIC bar fixed at the bottom on every screen. */
:root{
  --ink:#07140a; --lime:#a8e000; --lime-2:#82b509; --forest:#15240d; --pale:#f4ffb0; --amber:#ffc21a;
  --bg:#15240d; --bg2:#15240d; --surface:#1a3314; --surface2:#234220; --text:#f3f9ea; --muted:#a9c19d;
  --line:#3f7036; --shadow:#050d04; --map:#0d1b09; --tfill:#16300f; --tline:#4d8a41; --sel-line:#ffffff; --chip:#244423;
  --display:'Big Shoulders Display','Impact','Arial Narrow',sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:500 15px/1.45 var(--body);padding-inline:0;padding-block:0 64px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.disp{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:.95;text-wrap:balance}
.eyebrow{font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--shadow)}
.pad{padding:20px}

/* demo bar */
.demobar{background:var(--ink);color:#f3f9ea;border-bottom:3px solid var(--lime)}
.demobar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:8px}
.dtag{font:900 12px var(--display);letter-spacing:.12em;background:var(--amber);color:var(--ink);padding:3px 10px;border-radius:999px;text-transform:uppercase}
.seg{display:inline-flex;border:2px solid #3f7036;border-radius:999px;overflow:hidden;background:#0d1b09}
.seg button{border:0;background:transparent;color:#cfe3c4;padding:6px 14px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.dclock{display:flex;align-items:center;gap:8px;font-size:12px;color:#cfe3c4}
.dclock select{background:#0d1b09;color:#f3f9ea;border:2px solid #3f7036;border-radius:999px;padding:5px 10px;font-size:13px;max-width:100%}
.dspace{flex:1}
.iconbtn{background:#0d1b09;border:2px solid #3f7036;color:#f3f9ea;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 15px var(--body);border:3px solid var(--ink);background:var(--lime);color:var(--ink);border-radius:999px;padding:10px 20px;box-shadow:4px 4px 0 var(--ink);text-decoration:none;transition:transform .08s,box-shadow .08s;min-height:44px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line);box-shadow:4px 4px 0 var(--shadow)}
.btn.ghost:active{box-shadow:1px 1px 0 var(--shadow)}
.btn.sm{padding:6px 14px;font-size:13px;min-height:36px;box-shadow:3px 3px 0 var(--shadow)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;padding:3px 11px;font:700 12px var(--body);background:var(--chip);color:var(--text);white-space:nowrap}
button.chip{min-height:34px;padding-inline:14px;font-size:13px}
button.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-block:4px 8px;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin}
.demo-tag{display:inline-flex;font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.pill{display:inline-flex;font:800 11px var(--body);border-radius:999px;padding:2px 9px;border:2px solid var(--line);background:var(--chip)}
.pill.res{background:var(--amber);color:var(--ink);border-color:var(--ink)}
.pill.vend{background:#5b6b55;color:#fff;border-color:var(--ink)}
.pill.int{background:transparent}

/* header */
.top{background:var(--bg2);border-bottom:3px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{height:58px;width:auto;flex:none;display:block}
.ev{font-size:26px}
.sub{font-size:13px;color:var(--muted)}
.topin .grow{flex:1;min-width:150px}
.banner{background:var(--lime);color:var(--ink);border-bottom:3px solid var(--ink)}
.banner .wrap{padding-block:9px;font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.banner b{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:20px;letter-spacing:.04em}

/* tabs */
.tabs{display:flex;gap:8px;margin-block:16px 14px;flex-wrap:wrap}
.tabs button{flex:1 1 0;min-width:0;font:900 18px var(--display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;border:3px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;box-shadow:4px 4px 0 var(--shadow);min-height:46px}
.tabs button:nth-child(2){flex:1.45 1 0}
@media(max-width:480px){.tabs button{font-size:15px;letter-spacing:.01em;padding-inline:6px}}
.tabs button[aria-selected="true"]{background:var(--lime);color:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}

/* map */
.mapwrap{position:relative;border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);overflow:hidden;background:var(--map)}
#mapbox{height:clamp(300px,60vh,560px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#mapbox:active{cursor:grabbing}
@media(max-width:700px){#mapbox{height:clamp(440px,76vh,780px)}}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media(min-width:1000px){.mapgrid{grid-template-columns:minmax(0,1fr) 350px}.mapgrid .preview{margin-top:0;position:sticky;top:16px}#mapbox{height:clamp(440px,72vh,680px)}}
#map{width:100%;height:100%;display:block}
.hint{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 10px;pointer-events:none;color:var(--muted)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--lime);color:var(--ink);font:900 24px/1 var(--display);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center}
.zoom button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-block:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:14px;border-radius:4px;border:2px solid var(--ink);display:inline-block}
.sw.inv{background:var(--lime)}
.sw.empty{background:var(--tfill);border-color:var(--tline)}
.sw.sel{background:var(--pale)}
.room{fill:none;stroke:var(--line);stroke-width:2.5}
.aisle{stroke:var(--tline);stroke-width:1.3;stroke-dasharray:6 6;opacity:.7}
.aisle-t{font:900 10px var(--display);letter-spacing:.2em;fill:var(--lime);paint-order:stroke;stroke:var(--map);stroke-width:7px}
.zone{fill:var(--tfill);stroke:var(--tline);stroke-width:1.6}
.zone-t{font:800 8.5px var(--body);fill:var(--muted);text-anchor:middle}
.door{fill:var(--text);opacity:.85}
.tb{cursor:pointer}
.tb .t{fill:var(--tfill);stroke:var(--tline);stroke-width:1.6}
.tb text{fill:var(--text);pointer-events:none}
.nf{font:900 20px var(--display);display:none}
.far .nf{display:block}
.far .num,.far .nm{display:none}
.tb .num{font:900 12px var(--display);letter-spacing:.02em}
.tb .nm{font:700 8px var(--body)}
.tb .ring{fill:none;stroke:var(--lime-2);stroke-width:2.4;pointer-events:none}
.tb.inv .t{fill:var(--lime);stroke:var(--ink)}
.tb.inv text{fill:var(--ink)}
.tb:hover .t{stroke-width:3}
.tb.sel .t{fill:var(--pale);stroke:var(--sel-line);stroke-width:4}
.tb.sel text{fill:var(--ink)}
.tb.dim{opacity:.22}
.tb:focus-visible .t{stroke:var(--sel-line);stroke-width:4}
.tb:focus{outline:none}

/* preview + lists */
.preview{margin-top:16px}
.pv-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.pv-name{font-size:34px}
.pv-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-block:16px}
.mini{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2);min-width:0}
.mini .ph{aspect-ratio:1;width:100%;display:block;object-fit:cover}
.mini div{padding:6px 9px 8px;font-size:12px;font-weight:700;line-height:1.25}
.mini .pr{font:900 17px var(--display);display:block;margin-top:2px;letter-spacing:.02em}
.ph{display:block;max-width:100%}
.searchbox{display:flex;gap:10px;align-items:center}
input[type="text"],input[type="search"],input[type="number"]{width:100%;background:var(--surface);color:var(--text);border:3px solid var(--line);border-radius:16px;padding:11px 14px;min-height:48px;font-weight:600}
input::placeholder{color:var(--muted);opacity:.8}
.sect{margin-block:22px 10px;font-size:26px}
.rows{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:3px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:4px 4px 0 var(--shadow);width:100%;text-align:left}
.row .l{min-width:0;flex:1 1 200px}
.row .nm{font:900 22px var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1}
.row .sm{font-size:13px;color:var(--muted);margin-top:3px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:3px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:4px 4px 0 var(--shadow);padding:10px}
.prow .th{width:64px;flex:none;border-radius:12px;overflow:hidden;border:3px solid var(--ink)}
.prow .th .ph{width:100%;aspect-ratio:1;object-fit:cover}
.empty{text-align:center;padding:28px 18px;border:3px dashed var(--line);border-radius:20px;color:var(--muted)}
.empty b{display:block;font:900 24px var(--display);text-transform:uppercase;color:var(--text);margin-bottom:4px}

/* ficha */
.back{margin-block:16px 12px}
.hero{background:var(--lime);color:var(--ink);border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:20px}
.hero .chip{background:rgba(7,20,10,.1);border-color:var(--ink);color:var(--ink)}
.hero h1{font-size:clamp(40px,9vw,72px);margin:6px 0 10px}
.hero p{margin:6px 0 0;font-weight:600}
.hero .eyebrow{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-block:16px 8px}
.item{background:var(--surface);border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.item .ph{width:100%;aspect-ratio:1;object-fit:cover;border-bottom:3px solid var(--line)}
.item .ib{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.item .in{font-weight:800;line-height:1.2}
.item .note{font-size:12px;color:var(--muted)}
.item .price{font:900 26px var(--display);letter-spacing:.02em}
.item .price small{font:700 11px var(--body);color:var(--muted);margin-left:4px}
.item .btn{margin-top:auto;width:100%;font-size:13px;padding-inline:10px}
.item .pill{align-self:flex-start}
.item.flash{animation:flash 1.4s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 5px var(--lime)}}

/* welcome */
.welcome{display:grid;grid-template-columns:1fr;gap:24px;padding-block:28px 12px;align-items:center}
.biglogo{width:min(340px,78vw);height:auto;display:block;margin-inline:auto}
@media(max-width:699px){.biglogo{width:120px}.welcome{gap:10px;padding-block:12px 8px}.logo{height:40px}.welcome .h1{font-size:30px;margin:4px 0 8px}.welcome .lead{font-size:14px;margin-bottom:12px}}
.h1{font-size:clamp(40px,8vw,64px);margin:8px 0 10px}
.lead{margin:0 0 16px;color:var(--muted);max-width:52ch}
.codeform{display:flex;gap:10px;flex-wrap:wrap}
#codeIn{max-width:210px;font:900 34px var(--display);letter-spacing:.35em;text-transform:uppercase;text-align:center;padding-block:6px}
.msg{min-height:22px;margin:8px 0 0;font-weight:700;color:var(--amber)}
.codes{display:grid;gap:8px;margin-block:10px 4px}
.code-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px dashed var(--line);border-radius:14px;background:transparent;padding:8px 12px;text-align:left;width:100%}
.code-row .cn{font-weight:800;min-width:110px}
.code-row .cc{font:900 22px var(--display);letter-spacing:.2em;color:var(--lime)}
.code-row .cs{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);margin-block:14px;font-weight:700}
.or::before,.or::after{content:"";height:2px;background:var(--line);flex:1}
@media(min-width:860px){.welcome{grid-template-columns:minmax(260px,380px) 1fr;gap:48px;padding-block:44px}}

/* seller */
.snav{position:sticky;top:0;z-index:25;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin-top:14px;background:var(--bg);border-bottom:3px solid var(--line);scrollbar-width:none}.snav::-webkit-scrollbar{display:none}.snav button{flex:none;font:900 14px var(--display);letter-spacing:.03em;text-transform:uppercase;border:3px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}.snav button:active{background:var(--lime);color:var(--ink)}.sstack{margin-block:16px;max-width:860px}.sstack>section{scroll-margin-top:70px}.totop{position:fixed;right:14px;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:29;font:900 14px var(--display);letter-spacing:.04em;text-transform:uppercase;background:var(--lime);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.slayout{display:grid;grid-template-columns:1fr;gap:20px;margin-block:16px}
@media(min-width:960px){.slayout{grid-template-columns:minmax(300px,390px) minmax(0,1fr);align-items:start}}
.stack{display:grid;gap:20px;min-width:0}
.shead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-top:18px}
.shead h1{font-size:clamp(34px,7vw,52px);margin:4px 0 0}
.sel select{background:var(--surface);color:var(--text);border:3px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:700;min-height:44px;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{border:3px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 12px;box-shadow:4px 4px 0 var(--shadow);min-width:0}
.stat b{display:block;font:900 34px var(--display);line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label,.fld>.lb{font-weight:800;font-size:14px}
.fld .opt{font-weight:600;color:var(--muted);font-size:12px}
.pricewrap{position:relative}.manual{max-width:820px;padding-block:18px}.manual h1{font-size:clamp(34px,7vw,52px);margin:4px 0 12px}.mtoc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.mtoc button{border:3px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:800 13px var(--body);cursor:pointer}.manual h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,5vw,38px);margin:32px 0 8px;color:var(--lime);scroll-margin-top:12px}.manual h3{font-size:18px;margin:20px 0 6px;scroll-margin-top:12px}.manual p,.manual li{line-height:1.55}.manual ul,.manual ol{padding-left:22px;margin:8px 0}.manual li{margin-block:4px}.manual strong{color:var(--pale)}.drow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:start;border-bottom:2px dashed var(--line);padding-block:12px}.drow .th{width:72px;height:72px;border-radius:12px;overflow:hidden;border:3px solid var(--ink)}.drow .th img{width:100%;height:100%;object-fit:cover;display:block}.drow .df{display:grid;grid-template-columns:1fr 96px;gap:8px}.drow .df .full{grid-column:1/-1}.drow.bad input{border-color:var(--amber)}.drow select{width:100%;background:var(--surface);color:var(--text);border:3px solid var(--line);border-radius:16px;padding:8px 10px;min-height:48px;font:700 14px var(--body)}.drow .x{border:0;background:transparent;color:var(--muted);font:900 22px/1 var(--body);cursor:pointer;padding:4px 8px}.dbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.dbar .btn:first-child{flex:1}.addrow{display:flex;gap:8px;align-items:stretch}.addrow input{flex:1;min-width:0}.xchip{gap:6px}.xchip button{border:0;background:transparent;color:inherit;font:900 18px/1 var(--body);padding:0 0 0 4px;cursor:pointer}
.pricewrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.pricewrap input{padding-left:30px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cats button{border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:800;min-height:48px}
.cats button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo .pv{width:64px;height:64px;border-radius:12px;border:3px solid var(--ink);overflow:hidden;background:var(--surface2)}
.photo .pv img{width:100%;height:100%;object-fit:cover;display:block}
.err{color:var(--amber);font-weight:700;font-size:13px;min-height:18px;margin:0}
.ftabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.srow{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;align-items:center;border:3px solid var(--line);border-radius:18px;background:var(--surface);padding:10px;box-shadow:4px 4px 0 var(--shadow);min-width:0}
.srow.sold{opacity:.6}
.srow .th{width:64px;border-radius:12px;overflow:hidden;border:3px solid var(--ink)}
.srow .th .ph{width:100%;aspect-ratio:1;object-fit:cover}
.srow .sname{font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.srow .smeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.srow .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pricebox{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:2px 8px;background:var(--bg);font-weight:800}
.pricebox input{width:84px;border:0;background:transparent;padding:4px 2px;min-height:30px;font-weight:800;border-radius:6px;font-size:15px}
.srow .seg{border-color:var(--line);background:var(--bg)}
.srow .seg button{color:var(--text);padding:7px 12px}
.srow .seg button[aria-pressed="true"]{color:var(--ink)}
.srow .seg button[data-v="res"][aria-pressed="true"]{background:var(--amber)}
.srow .seg button[data-v="vend"][aria-pressed="true"]{background:#8fa088}
.log{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.log li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px dashed var(--line);padding-bottom:8px;font-size:14px}
.log li small{color:var(--muted)}
.sign{background:var(--lime);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:18px;text-align:center;max-width:330px;margin-inline:auto}

<template id="manualTpl"><p>Plano interactivo de mesas con inventario, hecho por VIC (Very Important Cards). Este manual explica cómo funciona todo: lo que ya existe en el demo y lo que se define para la versión real.</p>
<h2 id="m-1">1. Qué es y para qué sirve</h2>
<p>Es un mapa digital del evento. Cada mesa sube su inventario y los visitantes pueden encontrar rápido lo que buscan, sin recorrer todo el salón. El visitante le escribe directo al vendedor por WhatsApp. No hay pagos en la plataforma: la venta se cierra entre las dos personas.</p>
<p>Hay dos tipos de usuario:</p>
<ul>
<li><strong>Visitante:</strong> explora el mapa, busca piezas, guarda favoritas y contacta vendedores.</li>
<li><strong>Vendedor:</strong> administra el inventario de su mesa.</li>
</ul>
<p>La plataforma tiene los colores y el logo del México Card Show. En todas las pantallas aparece "Powered by VIC" abajo. Solo existe en tema oscuro y está pensada primero para celular; también funciona en computador.</p>
<h2 id="m-2">2. Qué es el demo y qué no hace</h2>
<p>El demo sirve para ver y probar cómo se ve y se siente la plataforma. Hay que saber esto:</p>
<ul>
<li>La barra superior dice <strong>VIC DEMO</strong> y trae tres botones: Visitante, Vendedor y Manual, además de un <strong>reloj de prueba</strong>.</li>
<li>Solo cuatro mesas tienen inventario de ejemplo: <strong>6 (Killers TCG), 17 (Treasure Sports), 22 (Toy Zone) y 49 (Atomic Store)</strong>. Atomic Store es la más completa porque es la tienda de uno de los organizadores. Las demás dicen "Inventario por cargar".</li>
<li>Los precios son de ejemplo, en pesos mexicanos (MXN), y los números de WhatsApp son ficticios.</li>
<li><strong>El demo no guarda nada al recargar la página.</strong> Las piezas nuevas, las fotos, los corazones y las categorías que agregues se pierden. Guardar de verdad requiere el servidor de la versión real.</li>
<li>El reloj de prueba permite simular cuatro momentos: todo cerrado, VIP abierto, Early Access abierto y evento abierto.</li>
<li>Los códigos de ejemplo son <strong>V7K2</strong> (VIP), <strong>E3A9</strong> (Early Access) y <strong>G5M4</strong> (General).</li>
</ul>
<h2 id="m-3">3. Guía del visitante</h2>
<h3 id="m-4">3.1 Entrar</h3>
<ol>
<li>Abre la plataforma. Verás la pantalla de bienvenida con el logo del show.</li>
<li>Escribe tu código de acceso y toca <strong>Entrar</strong>.</li>
<li>Si el código es válido pero aún no abre tu nivel, la pantalla te dice cuánto falta.</li>
<li>Si el código no es válido, te lo indica para que lo revises.</li>
</ol>
<p>Hay tres niveles de acceso, y cada uno abre a una hora distinta:</p>
<ul>
<li><strong>VIP:</strong> abre 12 horas antes del evento.</li>
<li><strong>Early Access:</strong> abre 3 horas antes.</li>
<li><strong>Acceso general:</strong> abre cuando comienza el evento.</li>
</ul>
<p>También se puede entrar <strong>escaneando el QR de una mesa</strong>, sin código. El QR lleva directo al inventario de esa mesa, y desde ahí puedes seguir explorando el resto de la plataforma.</p>
<h3 id="m-5">3.2 Las tres vistas principales</h3>
<p>Arriba hay tres botones, en este orden: <strong>Mapa, Participantes y Buscar</strong>.</p>
<p><strong>Mapa</strong></p>
<ul>
<li>Es el plano original del salón, sin cambios. En celular se muestra girado, con la entrada abajo y el Bar &amp; Lounge arriba. En computador se ve en horizontal, con un panel al lado.</li>
<li>Con los dedos puedes acercar y alejar (pellizco), o con la rueda del ratón en computador. Arrastra para moverte.</li>
<li>Alejado, las mesas muestran su número. Acercado, muestran también el nombre del negocio.</li>
<li><strong>Toca una mesa</strong> para ver una vista previa: nombre, número, categorías y algunas piezas. En celular sale una tarjeta abajo; en computador, un panel al lado.</li>
<li>Desde la vista previa entras a la <strong>ficha completa</strong> de la mesa.</li>
<li>Las mesas dobles aparecen como una sola cápsula, con el nombre centrado y los números unidos (por ejemplo 41–42).</li>
<li>Puedes filtrar el mapa por categoría para ver qué mesas venden lo que buscas.</li>
</ul>
<p><strong>Participantes</strong></p>
<ul>
<li>Lista de todos los negocios en orden alfabético (A–Z).</li>
<li>Filtros por categoría: TCG, Deportes, Juguetes, Cajas selladas y Otro.</li>
<li>Las mesas sin inventario dicen "Inventario por cargar".</li>
</ul>
<p><strong>Buscar</strong></p>
<ul>
<li>Un buscador para mesas y piezas. Escribe un nombre y verás resultados de ambos.</li>
<li>Mientras escribes aparecen sugerencias.</li>
</ul>
<h3 id="m-6">3.3 La ficha de una mesa</h3>
<p>Muestra el nombre del negocio, su número de mesa, sus categorías y todo su inventario. Cada pieza tiene foto (o una imagen de ejemplo), nombre, precio y un corazón. Puedes buscar dentro del inventario de esa mesa y filtrar por tipo.</p>
<p>Si la mesa también compra, verás "Esta mesa también compra" con las categorías que le interesan, y lo que busca en especial.</p>
<h3 id="m-7">3.4 Me interesa</h3>
<ol>
<li>Toca <strong>Me interesa</strong> en la pieza.</li>
<li>Se abre WhatsApp con un mensaje ya escrito para el vendedor.</li>
<li>Habla con el vendedor y acuerden cómo seguir.</li>
</ol>
<p>Importante: <strong>tocar Me interesa no aparta la pieza.</strong> La pieza sigue disponible para todos hasta que el vendedor la marque como Reservada o Vendida. La decisión es del vendedor, después de hablar contigo.</p>
<h3 id="m-8">3.5 Lista de deseos</h3>
<ul>
<li>Toca el <strong>corazón</strong> en cualquier pieza para guardarla. Aparece un mensaje rápido arriba: "Agregado a tu lista de deseos". Vuelve a tocarlo para quitarla.</li>
<li>Entra a tu lista con el botón del corazón en la barra superior, que muestra cuántas piezas llevas.</li>
<li>La lista muestra un <strong>total estimado en pesos mexicanos</strong> de lo que tienes como favorito.</li>
<li>Si una pieza se vende, <strong>sigue en tu lista pero aparece como "No disponible"</strong> y no suma al total. Así sabes qué pasó con ella.</li>
<li>La lista se guarda en tu dispositivo.</li>
<li>Al guardar una pieza, el vendedor ve que le interesa (ver 4.8).</li>
</ul>
<h3 id="m-9">3.6 Quiero vender</h3>
<p>Si traes piezas para vender, entra al panel <strong>Vender</strong> (botón arriba). No es obligatorio: quien solo viene a mirar no necesita usarlo.</p>
<ol>
<li>Escribe tu nombre y tu WhatsApp.</li>
<li>Agrega cada pieza con nombre, precio, categoría y foto opcional.</li>
<li>Marca como vendida o borra las que ya no tengas.</li>
<li>La plataforma te muestra <strong>qué mesas compran esas categorías</strong> y te deja escribirles por WhatsApp.</li>
</ol>
<p>Los vendedores ven tus piezas en su sección "Visitantes que quieren vender" si coinciden con lo que compran.</p>
<h2 id="m-10">4. Guía del vendedor</h2>
<p>Entra con el botón <strong>Vendedor</strong> (en el demo) o con tu cuenta (en la versión real). Arriba ves el nombre de tu negocio y tu mesa. En el demo, un selector "Entrar como" permite cambiar entre las cuatro mesas de ejemplo.</p>
<h3 id="m-11">4.1 Resumen y menú</h3>
<p>Arriba hay cuatro números: <strong>Disponibles, Reservadas, Vendidas e Interesados</strong>.</p>
<p>Debajo hay un <strong>menú fijo</strong> que te acompaña mientras bajas: Resumen, Agregar, Rápida, QR, Inventario, Compro, Vendedores e Interesados. Tócalo para saltar a cada sección. "Resumen" te lleva de vuelta al inicio.</p>
<h3 id="m-12">4.2 Agregar pieza</h3>
<p>El formulario está pensado para ser lo más simple posible:</p>
<ol>
<li><strong>Foto</strong> (opcional): toma una foto o elige una de la galería.</li>
<li><strong>Nombre</strong> de la pieza.</li>
<li><strong>Precio.</strong></li>
<li><strong>Categoría</strong> con un toque: TCG, Deportes, Juguetes, Caja sellada u Otro. Si no eliges, queda en Otro.</li>
<li>Toca <strong>Guardar y agregar otra</strong>. La pieza queda visible para el público de inmediato.</li>
</ol>
<h3 id="m-13">4.3 Carga rápida</h3>
<p>Para subir varias piezas a la vez:</p>
<ol>
<li>Toca <strong>Elegir fotos de la galería</strong> y selecciona varias.</li>
<li>Cada foto se convierte en una fila con su miniatura.</li>
<li>Escribe el nombre y el precio de cada una. La categoría es opcional.</li>
<li>Toca <strong>Publicar N piezas</strong>.</li>
</ol>
<p>Las piezas a las que les falte nombre o precio no se publican: quedan marcadas con borde ámbar para que las completes. <strong>Limpiar</strong> descarta las que no hayas publicado.</p>
<h3 id="m-14">4.4 Tu QR de mesa</h3>
<p>Es un letrero con el QR de tu mesa, para imprimir y colocar en ella. Quien lo escanee <strong>entra directo a tu inventario, sin código</strong>. Debajo hay un botón para probar la plataforma como visitante.</p>
<h3 id="m-15">4.5 Tu inventario</h3>
<p>Todas tus piezas en una lista.</p>
<ul>
<li><strong>Buscador</strong> arriba para encontrar una pieza por nombre o categoría.</li>
<li><strong>Filtros</strong> por estado: Todas, Disponibles, Reservadas y Vendidas.</li>
<li>En cada pieza puedes <strong>cambiar el precio</strong> directamente, <strong>cambiar el estado</strong> y <strong>pausarla</strong>.</li>
</ul>
<p>Los estados:</p>
<ul>
<li><strong>Disponible:</strong> la ven todos y la pueden reservar.</li>
<li><strong>Reservada:</strong> la marcas tú después de hablar con el comprador.</li>
<li><strong>Vendida:</strong> desaparece de la vista pública. En las listas de deseos de los visitantes se muestra como "No disponible".</li>
<li><strong>Pausada:</strong> la oculta temporalmente sin borrarla. Úsala si la tienes apartada o no la puedes atender. Puedes reanudarla cuando quieras.</li>
</ul>
<h3 id="m-16">4.6 Me interesa comprar</h3>
<p>Aquí le dices a la plataforma qué compras:</p>
<ul>
<li>Toca las categorías que te interesan: TCG, Deportes, Juguetes o Cajas selladas.</li>
<li>Para algo más específico, escribe en "Otra cosa que buscas" (por ejemplo "Panini" o "One Piece") y toca <strong>Agregar</strong>, o presiona Enter. Aparece como un botón más, junto a las categorías. Tócalo para quitarlo.</li>
</ul>
<p>Esto hace dos cosas: los visitantes ven en tu ficha que tu mesa compra eso, y los visitantes que traen esas piezas aparecen en tu lista de la sección siguiente.</p>
<h3 id="m-17">4.7 Visitantes que quieren vender</h3>
<p>Son los visitantes que subieron piezas que coinciden con lo que tú compras, por categoría o por palabras que agregaste. Cada uno trae una foto, nombre y precio. Toca el botón para <strong>escribirle por WhatsApp</strong> y pídele que pase por tu mesa.</p>
<h3 id="m-18">4.8 Interesados</h3>
<p>Aquí aparece cada vez que un visitante <strong>toca el corazón</strong> en una de tus piezas, es decir, la guardó en su lista de deseos. Son compradores con interés real. Si quita el corazón, desaparece de la lista.</p>
<p><strong>Tocar "Me interesa" no cuenta aquí.</strong> Ese botón es otra cosa: es el visitante escribiéndote por WhatsApp, y la decisión de reservar la pieza o no la tomas tú.</p></template>

  if(S.drafts.length){toast(n?n+' publicadas. Faltan nombre o precio en '+S.drafts.length+'.':'Falta el nombre o el precio en '+S.drafts.length+(S.drafts.length===1?' pieza.':' piezas.'))}else toast(n+(n===1?' pieza publicada. Ya la ve el público.':' piezas publicadas. Ya las ve el público.'))}
function saveItem(){
  const name=$('#f-name').value.trim(),price=Number($('#f-price').value),err=$('#f-err');
  if(!name){err.textContent='Escribe el nombre de la pieza.';$('#f-name').focus();return}
  if(!(price>=0)||$('#f-price').value===''){err.textContent='Escribe el precio.';$('#f-price').focus();return}
  err.textContent='';const cat=S.formCat||'Otro';
  ITEMS.unshift({id:'n'+(++S.seq),booth:S.sellerBooth,name,cat,note:CAT_LABEL[cat],price:Math.round(price),status:'disp',interested:0,paused:false,img:S.formImg});
  S.formImg=null;S.formCat=null;$('#addForm').reset();clearPhoto();document.querySelectorAll('[data-act="fcat"]').forEach(b=>b.setAttribute('aria-pressed','false'));
  renderSellerList();renderSellerStats();toast('Pieza guardada. Ya la ve el público.');$('#f-name').focus();
}
setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(el=>{const ms=Number(el.dataset.cd)-now();el.textContent=fmt(ms);if(ms<=0&&!el.dataset.done){el.dataset.done='1';if(S.screen!=='seller')render()}})},1000);
render();
</script>
